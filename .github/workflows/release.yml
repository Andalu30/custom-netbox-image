name: Build and release image

on:
  # Build only (no push) to validate changes.
  pull_request:
  push:
    branches: [ main ]
  # Build and push to GHCR when a release is published.
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # Race condition avoidance.

env:
  REGISTRY: ghcr.io

jobs:

  # This matrix is an overengineered way to build this image. It's just one! But acts as a template for future flows where we might need multiple images.
  build-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # Required to push to GHCR with GITHUB_TOKEN.

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Netbox Plugins
            image: ${{ github.repository }}
            dockerfile: ./Dockerfile

          # Add other images here if needed (using this as a template)

    steps:
      - uses: actions/checkout@v6
        name: Checkout codebase

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # On release: the raw tag (e.g. v1.2.3), semver variants (1.2.3, 1.2) and latest.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=ref,event=pr
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
